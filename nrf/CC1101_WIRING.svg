<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CC1101 → ProMicro nRF52840 V1940 (Nice!Nano) — Схема подключения</text>
  
  <!-- CC1101 Module -->
  <rect x="50" y="80" width="180" height="320" rx="10" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="white">CC1101</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#E3F2FD">315/433 MHz</text>
  
  <!-- CC1101 Pins -->
  <g font-size="12" fill="white">
    <!-- Left side pins -->
    <rect x="60" y="150" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="166" text-anchor="middle">VCC</text>
    
    <rect x="60" y="185" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="201" text-anchor="middle">GND</text>
    
    <rect x="60" y="220" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="236" text-anchor="middle">SCK</text>
    
    <rect x="60" y="255" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="271" text-anchor="middle">MISO</text>
    
    <rect x="60" y="290" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="306" text-anchor="middle">MOSI</text>
    
    <rect x="60" y="325" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="341" text-anchor="middle">CSN</text>
    
    <rect x="60" y="360" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="95" y="376" text-anchor="middle">GDO0</text>
    
    <!-- Right side pins -->
    <rect x="150" y="150" width="70" height="24" rx="3" fill="#1565C0"/>
    <text x="185" y="166" text-anchor="middle">GDO2</text>
  </g>
  
  <!-- ProMicro nRF52840 -->
  <rect x="500" y="60" width="220" height="380" rx="10" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="610" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="white">ProMicro nRF52840</text>
  <text x="610" y="108" text-anchor="middle" font-size="11" fill="#E8F5E9">V1940 (Nice!Nano)</text>
  
  <!-- ProMicro Pin Labels (physical markers) -->
  <g font-size="10" fill="white" font-weight="bold">
    <!-- Left side pins (P0.xx) -->
    <rect x="510" y="130" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="144" text-anchor="middle">002</text>
    
    <rect x="510" y="160" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="174" text-anchor="middle">006</text>
    
    <rect x="510" y="190" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="204" text-anchor="middle">008</text>
    
    <rect x="510" y="220" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="234" text-anchor="middle">010</text>
    
    <rect x="510" y="250" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="264" text-anchor="middle">017</text>
    
    <rect x="510" y="280" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="294" text-anchor="middle">020</text>
    
    <rect x="510" y="310" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="324" text-anchor="middle">022</text>
    
    <rect x="510" y="340" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="354" text-anchor="middle">024</text>
    
    <rect x="510" y="370" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="384" text-anchor="middle">029</text>
    
    <rect x="510" y="400" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="535" y="414" text-anchor="middle">031</text>
    
    <!-- Right side pins (P1.xx) -->
    <rect x="660" y="130" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="144" text-anchor="middle">100</text>
    
    <rect x="660" y="160" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="174" text-anchor="middle">101</text>
    
    <rect x="660" y="190" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="204" text-anchor="middle">102</text>
    
    <rect x="660" y="220" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="234" text-anchor="middle">104</text>
    
    <rect x="660" y="250" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="264" text-anchor="middle">111</text>
    
    <rect x="660" y="280" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="294" text-anchor="middle">113</text>
    
    <rect x="660" y="310" width="50" height="20" rx="3" fill="#2E7D32"/>
    <text x="685" y="324" text-anchor="middle">115</text>
  </g>
  
  <!-- ProMicro Pin Functions (D-numbers) -->
  <g font-size="9" fill="#E8F5E9">
    <text x="565" y="144" text-anchor="start">P0.02 (AIN0)</text>
    <text x="565" y="174" text-anchor="start">P0.06 = D25</text>
    <text x="565" y="204" text-anchor="start">P0.08 = D27</text>
    <text x="565" y="234" text-anchor="start">P0.10</text>
    <text x="565" y="264" text-anchor="start">P0.17 = D34</text>
    <text x="565" y="294" text-anchor="start">P0.20 = D37</text>
    <text x="565" y="324" text-anchor="start">P0.22 = D39</text>
    <text x="565" y="354" text-anchor="start">P0.24 = D41</text>
    <text x="565" y="384" text-anchor="start">P0.29 = D46</text>
    <text x="565" y="414" text-anchor="start">P0.31 = D48</text>
    
    <text x="645" y="144" text-anchor="end">P1.00</text>
    <text x="645" y="174" text-anchor="end">P1.01 = D0</text>
    <text x="645" y="204" text-anchor="end">P1.02 = D1</text>
    <text x="645" y="234" text-anchor="end">P1.04 = D3</text>
    <text x="645" y="264" text-anchor="end">P1.11 = D8</text>
    <text x="645" y="294" text-anchor="end">P1.13 = D10</text>
    <text x="645" y="324" text-anchor="end">P1.15 = D12</text>
  </g>
  
  <!-- Wires - SPI Bus (Yellow) -->
  <g stroke="#FFC107" stroke-width="3" fill="none">
    <!-- SCK: CC1101 SCK → ProMicro 104 (P1.04 = D3) -->
    <line x1="130" y1="232" x2="300" y2="232"/>
    <line x1="300" y1="232" x2="660" y2="232"/>
    
    <!-- MISO: CC1101 MISO → ProMicro 029 (P0.29 = D46) -->
    <line x1="130" y1="267" x2="320" y2="267"/>
    <line x1="320" y1="267" x2="510" y2="380"/>
    
    <!-- MOSI: CC1101 MOSI → ProMicro 031 (P0.31 = D48) -->
    <line x1="130" y1="302" x2="340" y2="302"/>
    <line x1="340" y1="302" x2="510" y2="410"/>
  </g>
  
  <!-- Wires - Control (Red) -->
  <g stroke="#F44336" stroke-width="3" fill="none">
    <!-- CS: CC1101 CSN → ProMicro 006 (P0.06 = D25) -->
    <line x1="130" y1="337" x2="360" y2="337"/>
    <line x1="360" y1="337" x2="510" y2="170"/>
    
    <!-- GDO0: CC1101 GDO0 → ProMicro 008 (P0.08 = D27) -->
    <line x1="130" y1="372" x2="380" y2="372"/>
    <line x1="380" y1="372" x2="510" y2="200"/>
  </g>
  
  <!-- Wires - Control 2 (Orange) -->
  <g stroke="#FF9800" stroke-width="3" fill="none">
    <!-- GDO2: CC1101 GDO2 → ProMicro 113 (P1.13 = D10) -->
    <line x1="220" y1="162" x2="400" y2="162"/>
    <line x1="400" y1="162" x2="660" y2="290"/>
  </g>
  
  <!-- Wires - Power (Green) -->
  <g stroke="#4CAF50" stroke-width="3" fill="none">
    <!-- VCC: CC1101 VCC → ProMicro 3.3V -->
    <line x1="130" y1="162" x2="420" y2="162"/>
    <line x1="420" y1="162" x2="420" y2="80"/>
    <line x1="420" y1="80" x2="500" y2="80"/>
    <text x="425" y="75" font-size="10" fill="#2E7D32" font-weight="bold">3.3V</text>
    
    <!-- GND: CC1101 GND → ProMicro GND -->
    <line x1="130" y1="197" x2="440" y2="197"/>
    <line x1="440" y1="197" x2="440" y2="440"/>
    <line x1="440" y1="440" x2="500" y2="440"/>
    <text x="445" y="455" font-size="10" fill="#2E7D32" font-weight="bold">GND</text>
  </g>
  
  <!-- Wires - Power Control (Purple) -->
  <g stroke="#9C27B0" stroke-width="3" fill="none">
    <!-- POWER: ProMicro 111 (P1.11 = D8) → CC1101 VCC (via MOSFET) -->
    <line x1="660" y1="262" x2="460" y2="262"/>
    <line x1="460" y1="262" x2="460" y2="162"/>
    <text x="465" y="255" font-size="9" fill="#7B1FA2">POWER</text>
  </g>
  
  <!-- Wires - Battery ADC (Cyan) -->
  <g stroke="#00BCD4" stroke-width="3" fill="none">
    <!-- BATT: ProMicro 002 (P0.02 = AIN0) → Battery divider -->
    <line x1="510" y1="140" x2="480" y2="140"/>
    <line x1="480" y1="140" x2="480" y2="500"/>
    <text x="485" y="515" font-size="9" fill="#00838F">BATT ADC</text>
    <text x="485" y="528" font-size="8" fill="#00838F">(делитель 1:2)</text>
  </g>
  
  <!-- Wires - LED (Pink) -->
  <g stroke="#E91E63" stroke-width="2" fill="none" stroke-dasharray="5,3">
    <!-- LED: ProMicro 115 (P1.15 = D12) → Status LED -->
    <line x1="660" y1="320" x2="720" y2="320"/>
    <rect x="720" y="310" width="30" height="20" rx="3" fill="#E91E63"/>
    <text x="735" y="324" text-anchor="middle" font-size="9" fill="white">LED</text>
  </g>
  
  <!-- Wire Labels -->
  <g font-size="10" font-weight="bold">
    <text x="215" y="225" text-anchor="middle" fill="#F57F17">SCK</text>
    <text x="215" y="260" text-anchor="middle" fill="#F57F17">MISO</text>
    <text x="215" y="295" text-anchor="middle" fill="#F57F17">MOSI</text>
    <text x="215" y="330" text-anchor="middle" fill="#D32F2F">CS</text>
    <text x="215" y="365" text-anchor="middle" fill="#D32F2F">GDO0</text>
    <text x="310" y="155" text-anchor="middle" fill="#E65100">GDO2</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="480" width="700" height="100" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="500" font-size="12" font-weight="bold" fill="#333">Легенда:</text>
  
  <line x1="60" y1="520" x2="100" y2="520" stroke="#FFC107" stroke-width="3"/>
  <text x="110" y="524" font-size="10" fill="#333">SPI (SCK, MISO, MOSI)</text>
  
  <line x1="250" y1="520" x2="290" y2="520" stroke="#F44336" stroke-width="3"/>
  <text x="300" y="524" font-size="10" fill="#333">Управление (CS, GDO0)</text>
  
  <line x1="450" y1="520" x2="490" y2="520" stroke="#FF9800" stroke-width="3"/>
  <text x="500" y="524" font-size="10" fill="#333">GDO2</text>
  
  <line x1="60" y1="545" x2="100" y2="545" stroke="#4CAF50" stroke-width="3"/>
  <text x="110" y="549" font-size="10" fill="#333">Питание (3.3V, GND)</text>
  
  <line x1="250" y1="545" x2="290" y2="545" stroke="#9C27B0" stroke-width="3"/>
  <text x="300" y="549" font-size="10" fill="#333">POWER (управление питанием)</text>
  
  <line x1="450" y1="545" x2="490" y2="545" stroke="#00BCD4" stroke-width="3"/>
  <text x="500" y="549" font-size="10" fill="#333">Battery ADC</text>
  
  <line x1="60" y1="570" x2="100" y2="570" stroke="#E91E63" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="110" y="574" font-size="10" fill="#333">Status LED</text>
  
  <!-- Notes -->
  <text x="60" y="590" font-size="9" fill="#666">Важно: Пины промаркированы как P0.xx/P1.xx на плате. D-номера — это Arduino-маппинг (Feather variant).</text>
</svg>
