; PlatformIO Configuration for TPMS Emulator/Sniffer
; Board: ProMicro nRF52840 V1940 (Nice!Nano Feather-compatible variant)
; RF: CC1101 transceiver on 315/433 MHz
; Interface: BLE UART (Nordic UART Service)

[platformio]
default_envs = promicro_nrf52840

[env:promicro_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
monitor_filters = colorize

build_flags =
    -DUSE_TINYUSB
    -DCFG_DEBUG=0
    -DCONFIG_NFCT_PINS_AS_GPIOS

lib_deps =
