; PlatformIO Project Configuration
; TPMS Emulator for Acura RDX 2008 — v7.2 dual-platform
; ESP32-C3 Mini + CC1101 on 315 / 433 MHz
; ESP8266 D1 Mini + CC1101 on 315 / 433 MHz

; === Common settings ===
[common]
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    Links2004/WebSockets@^2.4.1

build_flags =

; === ESP32-C3 DevKitM-1 (default) ===
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; === ESP8266 D1 Mini ===
[env:esp8266-D1 Mini]
platform = espressif8266
board = D1 Miniv2
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_8266
board_build.ldscript = eagle.flash.4m1m.ld
