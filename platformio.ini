; TPMS Emulator/Sniffer for ProMicro nRF52840 V1940 (Nice!Nano clone)
; Replaces WiFi/Web UI with BLE + Android app

[platformio]
default_envs = promicro_nrf52840

[env:promicro_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200

lib_deps =
    ; Bluefruit52 и TinyUSB входят в ядро Adafruit nRF52
    ; CC1101 driver лежит в lib/CC1101_Driver

build_flags =
    -DUSE_TINYUSB
    -DTPMS_BOARD_PROMICRO_NRF52840
    -DCFG_DEBUG=0
    -DCONFIG_NFCT_PINS_AS_GPIOS

; Для прошивки через UF2: pio run, затем скопировать .uf2 на диск bootloader.
; Для upload через serial/bootloader: pio run -t upload
